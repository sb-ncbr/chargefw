[build-system]
requires = ["nanobind>=2.11", "scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "chargefw"
dynamic = ["version"]
description = "Empirical partial atomic charge calculation framework"
readme = "python/README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]
license = { text = "MIT" }
authors = [{ name = "ChargeFW contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Documentation = "https://chargefw.readthedocs.io/"
Examples = "https://chargefw.readthedocs.io/en/latest/examples/index.html"
Repository = "https://github.com/sb-ncbr/chargefw"

[project.optional-dependencies]
gemmi = ["gemmi==0.7.4"]
rdkit = ["rdkit>=2024.9"]

[project.scripts]
chargefw = "chargefw._cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/python/{wheel_tag}"
build.verbose = false
logging.level = "WARNING"
install.components = ["python"]
wheel.packages = ["python/chargefw"]
# One wheel for CPython 3.12 and later, built against the stable ABI.
wheel.py-api = "cp312"
wheel.license-files = ["LICENSE", "licenses/**/*"]

[tool.scikit-build.cmake.define]
CMAKE_INTERPROCEDURAL_OPTIMIZATION = "ON"
CHARGEFW_BUILD_LIBRARY = "OFF"
CHARGEFW_BUILD_CLI = "OFF"
CHARGEFW_BUILD_PYTHON = "ON"
CHARGEFW_BUILD_TESTS = "OFF"
CHARGEFW_ENABLE_NATIVE_OPTIMIZATIONS = "OFF"
CHARGEFW_FETCH_DEPENDENCIES = "ON"

[tool.cibuildwheel]
# One stable-ABI wheel per platform, tested with each listed CPython. Each runner builds only the
# identifiers that match its own platform and architecture.
build = [
  "cp31[2-4]-manylinux_x86_64",
  "cp31[2-4]-manylinux_aarch64",
  "cp31[2-4]-macosx_arm64",
  "cp31[2-4]-win_amd64",
]
config-settings = { "cmake.define.CHARGEFW_ENABLE_NATIVE_OPTIMIZATIONS" = "OFF" }
test-requires = ["pytest", "jsonschema"]
test-extras = "gemmi"
test-command = "pytest {project}/tests/python -q"

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
# Gemmi, oneTBB, and Microsoft's C++ runtime are already installed beside the extension and the command
# line (python/CMakeLists.txt); the repair checks for and bundles any remaining dependencies.
repair-wheel-command = """\
delvewheel repair --ignore-existing --analyze-existing --analyze-existing-exes \
-w "{dest_dir}" "{wheel}"\
"""

# The code needs macOS 13.3, and wheel tags record only the major version (DEVELOPMENT.md).
# cibuildwheel names arm64 wheels after _PYTHON_HOST_PLATFORM, not after the deployment target.
[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0", _PYTHON_HOST_PLATFORM = "macosx-14.0-arm64" }

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "CMakeLists.txt"
regex = '(?is)project\s*\(\s*chargefw\s+VERSION\s+(?P<numeric>[0-9]+\.[0-9]+\.[0-9]+)\b.*?set\(CHARGEFW_VERSION_SUFFIX\s+"(?P<suffix>[^"]*)"\)'
result = "{numeric}{suffix}"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.mypy]
# Check against the oldest supported Python, whichever interpreter runs mypy.
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["jsonschema"]
follow_untyped_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["C4", "E4", "E7", "E9", "F", "I", "SIM", "UP"]
