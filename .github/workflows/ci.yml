name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Formatting output depends on the clang-format release; keep it aligned with development.
      - run: python -m pip install pre-commit clang-format==22.1.8 ruff==0.17.2
      - run: pre-commit run --all-files --show-diff-on-failure
      - run: ruff check .
      - run: ruff format --check .

  gcc-debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ccache
      - run: >-
          python -m pip install
          'numpy>=2.0' 'nanobind>=2.11' 'gemmi==0.7.4' pytest jsonschema mypy
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-gcc-14-debug-${{ github.sha }}
          restore-keys: ccache-gcc-14-debug-
      - run: >-
          cmake --preset gcc-debug
          -DCMAKE_CXX_COMPILER=g++-14
          -DCHARGEFW_PYTHON_EXECUTABLE=${{ steps.python.outputs.python-path }}
      - run: cmake --build build/gcc-debug
      - run: ctest --test-dir build/gcc-debug --output-on-failure -E '^cpptest$'
      - run: ccache --show-stats
