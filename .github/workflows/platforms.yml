name: Platforms

# Builds and tests wheels for platforms that are not released yet. The wheels are kept only as workflow
# artifacts; the release workflow is unaffected.
on:
  push:
    branches: [platforms]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            build: cp31[1-4]-manylinux_aarch64
          - name: Windows x86-64
            runner: windows-2025
            build: cp31[1-4]-win_amd64
          - name: macOS arm64
            runner: macos-15
            build: cp31[1-4]-macosx_arm64
    env:
      CIBW_BUILD: ${{ matrix.build }}
      # Wheel tags record only the major macOS version, and the code needs 13.3 (DEVELOPMENT.md).
      CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=14.0
      CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
      # Gemmi, oneTBB, and Microsoft's C++ runtime are already installed beside the extension and the
      # command line (python/CMakeLists.txt); the repair checks for and bundles any remaining
      # dependencies.
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
        delvewheel repair --ignore-existing --analyze-existing --analyze-existing-exes
        -w "{dest_dir}" "{wheel}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build cibuildwheel==3.4.1
      - run: python -m build --sdist --outdir dist
      - name: Build and test the wheels
        shell: bash
        run: python -m cibuildwheel --output-dir wheelhouse dist/chargefw-*.tar.gz
      - name: Show the wheel contents
        shell: bash
        run: for wheel in wheelhouse/*.whl; do python -m zipfile -l "$wheel"; done
      # The runner has the C++ runtime installed system-wide, so the tests pass without the bundled
      # copy. The command-line executable finds only DLLs in its own directory, not in chargefw.libs.
      - name: Check the bundled C++ runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -I - wheelhouse/*.whl <<'EOF'
          import sys
          import zipfile

          runtime = {"msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll"}
          failures = []
          for wheel in sys.argv[1:]:
              names = set(zipfile.ZipFile(wheel).namelist())
              missing = sorted(name for name in runtime if f"chargefw/{name}" not in names)
              elsewhere = sorted(name for name in names if name.startswith("chargefw.libs/"))
              if missing or elsewhere:
                  failures.append(f"{wheel}: missing {missing}; outside the package {elsewhere}")
          if failures:
              sys.exit("\n".join(failures))
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.build }}
          path: wheelhouse/*.whl
          retention-days: 14
          if-no-files-found: error
