name: Platforms

# Builds and tests wheels for platforms that are not released yet. The wheels are kept only as workflow
# artifacts; the release workflow is unaffected.
on:
  push:
    branches: [platforms]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            build: cp314-manylinux_aarch64
          - name: Windows x86-64
            runner: windows-2025
            build: cp314-win_amd64
          - name: macOS arm64
            runner: macos-15
            build: cp314-macosx_arm64
    env:
      CIBW_BUILD: ${{ matrix.build }}
      # Wheel tags record only the major macOS version, and the code needs 13.3 (DEVELOPMENT.md).
      CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=14.0
      CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
      # Gemmi and oneTBB are already installed beside the extension and the command line; only their
      # dependencies, and those of the command-line executable, need to be found and bundled.
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
        delvewheel repair --ignore-existing --analyze-existing --analyze-existing-exes
        -w "{dest_dir}" "{wheel}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build cibuildwheel==3.4.1
      - run: python -m build --sdist --outdir dist
      - name: Build and test the wheel
        shell: bash
        run: python -m cibuildwheel --output-dir wheelhouse dist/chargefw-*.tar.gz
      - name: Show the wheel contents
        shell: bash
        run: python -m zipfile -l wheelhouse/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.build }}
          path: wheelhouse/*.whl
          retention-days: 14
          if-no-files-found: error
