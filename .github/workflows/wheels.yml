name: Wheels

# Builds the sdist once and one stable-ABI wheel per platform from it, testing each wheel with every
# supported CPython. CI calls it for every change and the release workflow for the published files. The
# build settings are in pyproject.toml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build --sdist --outdir dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel:
    needs: sdist
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-26.04
            artifact: wheel-linux-x86_64
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            artifact: wheel-linux-aarch64
          - name: macOS arm64
            runner: macos-15
            artifact: wheel-macos-arm64
          - name: Windows x86-64
            runner: windows-2025
            artifact: wheel-windows-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install cibuildwheel==3.4.1
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Build and test the wheel
        shell: bash
        run: python -m cibuildwheel --output-dir wheelhouse dist/chargefw-*.tar.gz
      - name: Show the wheel contents
        shell: bash
        run: for wheel in wheelhouse/*.whl; do python -m zipfile -l "$wheel"; done
      # The runner has the C++ runtime installed system-wide, so the tests pass without the bundled
      # copy. The command-line executable finds only DLLs in its own directory, not in chargefw.libs.
      - name: Check the bundled C++ runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -I - wheelhouse/*.whl <<'EOF'
          import sys
          import zipfile

          runtime = {"msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll"}
          failures = []
          for wheel in sys.argv[1:]:
              names = set(zipfile.ZipFile(wheel).namelist())
              missing = sorted(name for name in runtime if f"chargefw/{name}" not in names)
              elsewhere = sorted(name for name in names if name.startswith("chargefw.libs/"))
              if missing or elsewhere:
                  failures.append(f"{wheel}: missing {missing}; outside the package {elsewhere}")
          if failures:
              sys.exit("\n".join(failures))
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error
