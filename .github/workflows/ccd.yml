name: Component dictionary

# Publishes chargefw-ccd (packages/chargefw-ccd) from the current wwPDB Chemical Component Dictionary.
# The package version is the date of the newest component, and only a version newer than every one
# on PyPI is published, so a run with an unchanged dictionary builds and checks the wheel and publishes
# nothing. A run started by hand from another branch does
# the same.
#
# An upload skips a file that the index already holds. The index's copy is compared with the built
# wheel by SHA-256 before and after each upload, so "Re-run failed jobs" is safe and a later run cannot
# publish a different wheel under a version that TestPyPI has already accepted.
on:
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.generate.outputs.version }}
      publish: ${{ steps.index.outputs.publish }}
    defaults:
      run:
        working-directory: packages/chargefw-ccd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build gemmi==0.7.4 twine
      - name: Download the dictionary
        run: >-
          curl --fail --location --retry 3 --create-dirs --output "$RUNNER_TEMP/ccd/components.cif.gz"
          https://files.wwpdb.org/pub/pdb/data/monomers/components.cif.gz
      - name: Generate the data file
        id: generate
        run: |
          version=$(python -I generate.py "$RUNNER_TEMP/ccd/components.cif.gz")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check whether the version is newer than every published one
        id: index
        env:
          VERSION: ${{ steps.generate.outputs.version }}
        run: |
          python -I - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, urllib.error, urllib.request
          from packaging.version import Version

          url = "https://pypi.org/pypi/chargefw-ccd/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  published = [Version(version) for version in json.load(response)["releases"]]
          except urllib.error.HTTPError as error:
              # The project does not exist before its first upload.
              if error.code != 404:
                  raise
              published = []
          newer = all(Version(os.environ["VERSION"]) > version for version in published)
          print(f"publish={str(newer).lower()}")
          EOF
      - run: python -m build --wheel --outdir "$GITHUB_WORKSPACE/dist"
      - run: python -m twine check --strict "$GITHUB_WORKSPACE"/dist/*
      - name: Install the wheel and read the data file
        env:
          VERSION: ${{ steps.generate.outputs.version }}
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv environment
          environment/bin/python -m pip install --quiet --no-index "$GITHUB_WORKSPACE"/dist/*.whl
          environment/bin/python -I -c '
          import gzip, sys, chargefw_ccd
          assert chargefw_ccd.__version__ == sys.argv[1]
          with gzip.open(chargefw_ccd.path(), "rt") as file:
              assert file.readline() == f"chargefw-ccd 1 {sys.argv[1]}\n"
              assert sum(1 for _ in file) > 1_000_000
          ' "$VERSION"
      # A transfer RNA with 11 kinds of modified nucleotides, whose bonds only the dictionary gives.
      - name: Read 1EHZ with the released ChargeFW and the wheel
        working-directory: ${{ runner.temp }}
        run: |
          # Naming a pre-release lets pip choose one, so this works before 3.0.0 is on PyPI too.
          environment/bin/python -m pip install --quiet "chargefw>=3.0.0rc7"
          curl --fail --location --retry 3 --output 1EHZ.cif https://files.rcsb.org/download/1EHZ.cif
          environment/bin/python -I -c '
          import chargefw, chargefw_ccd
          molecule, = chargefw.io.read("1EHZ.cif", format="mmcif", components=chargefw_ccd.path())
          kinds = {issue.kind for issue in molecule.import_warnings}
          assert "unbonded_residue_atoms" not in kinds, kinds
          '
      - name: Write the checksum manifest
        working-directory: ${{ github.workspace }}
        run: (cd dist && sha256sum ./*) > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: chargefw-ccd-${{ steps.generate.outputs.version }}
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error

  testpypi:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: ccd-testpypi
      url: https://test.pypi.org/project/chargefw-ccd/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: chargefw-ccd-${{ needs.build.outputs.version }}
          path: release
      - run: (cd release/dist && sha256sum --check ../SHA256SUMS)
      - name: Check TestPyPI for conflicting files
        run: >-
          python3 -I utils/release/package_index.py preflight testpypi "$VERSION" release/SHA256SUMS
          --project chargefw-ccd
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release/dist/
          skip-existing: true
      - name: Check that TestPyPI holds the built wheel
        run: >-
          python3 -I utils/release/package_index.py verify testpypi "$VERSION" release/SHA256SUMS
          --project chargefw-ccd

  pypi:
    needs: [build, testpypi]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: ccd-pypi
      url: https://pypi.org/project/chargefw-ccd/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: chargefw-ccd-${{ needs.build.outputs.version }}
          path: release
      - run: (cd release/dist && sha256sum --check ../SHA256SUMS)
      - name: Check PyPI for conflicting files
        run: >-
          python3 -I utils/release/package_index.py preflight pypi "$VERSION" release/SHA256SUMS
          --project chargefw-ccd
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/dist/
          skip-existing: true
      - name: Check that PyPI holds the built wheel
        run: >-
          python3 -I utils/release/package_index.py verify pypi "$VERSION" release/SHA256SUMS
          --project chargefw-ccd
